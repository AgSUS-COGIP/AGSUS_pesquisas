<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" role="img" aria-labelledby="sigav-assinatura-titulo">
  <title id="sigav-assinatura-titulo">SIGAV — Sistema Integrado de Gestão de Avaliações</title>

  <!--
    Assinatura horizontal: símbolo + palavra, na proporção que o lockup da tela
    de acesso pede quando fica ao lado da cruz da AgSUS, separado por filete —
    o mesmo arranjo do SIGEPSI.

    A palavra usa a pilha de fontes do sistema, e não uma fonte embutida: a
    plataforma já carrega Geist, e embutir um arquivo de fonte num SVG de marca
    o tornaria pesado e difícil de editar. Para material impresso, a
    comunicação deve converter o texto em curvas.
  -->

  <defs>
    <linearGradient id="sigav-assinatura-degrade" x1="18" y1="66" x2="74" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#003b70" />
      <stop offset="0.55" stop-color="#0b6fae" />
      <stop offset="1" stop-color="#0b8f58" />
    </linearGradient>
  </defs>

  <path
    d="M20 34 L40 64 L72 24"
    fill="none"
    stroke="url(#sigav-assinatura-degrade)"
    stroke-width="17"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M20 34 L40 64 L72 24"
    fill="none"
    stroke="#ffffff"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <text
    x="98" y="58"
    font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="42"
    font-weight="700"
    letter-spacing="1.5"
    fill="#003b70"
  >SIGAV</text>
</svg>
