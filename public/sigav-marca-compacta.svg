<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="sigav-compacta-titulo">
  <title id="sigav-compacta-titulo">SIGAV</title>

  <!--
    Variante sólida, para tamanho pequeno — favicon e ícone de aplicativo.
    Sem o filete interno da marca principal: abaixo de 32px ele desaparece e só
    engrossa a mancha, que é exatamente o defeito que o favicon atual tem (a
    cruz de 738px reduzida a 16px perde os traços brancos e vira um borrão).

    Traço mais grosso que o da marca principal, de propósito: o que sobrevive à
    redução é a silhueta, não o detalhe.
  -->

  <defs>
    <linearGradient id="sigav-compacta-degrade" x1="16" y1="72" x2="82" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#003b70" />
      <stop offset="1" stop-color="#0b8f58" />
    </linearGradient>
  </defs>

  <path
    d="M20 32 L42 66 L76 22"
    fill="none"
    stroke="url(#sigav-compacta-degrade)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
