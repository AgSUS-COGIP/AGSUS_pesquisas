name: Deploy database migrations to production

# O QUE ESTE WORKFLOW NAO GARANTE
#
# Ele aplica as migrations e so' termina verde se o contrato de RPC existir no
# banco. Isso NAO e' o portao de ordem de deploy, e tratar como se fosse seria
# repetir 10/08/2026 achando que o problema esta' resolvido.
#
# O motivo e' o gatilho: este workflow roda em `push` para `main`, e a Vercel
# tambem publica em `push` para `main`. Os dois comecam juntos, em sistemas
# diferentes, sem nenhum ponto de sincronizacao. Um Action nao consegue segurar
# uma publicacao da Vercel: quem decide isso e' a propria Vercel.
#
# So' existem dois jeitos de fechar de verdade, e os dois sao configuracao fora
# deste arquivo:
#
#   1. Ignored Build Step na Vercel — um comando que consulta o resultado deste
#      workflow para o commit e sai 0 (nao publica) enquanto ele nao terminar.
#      Precisa de token de leitura da API do GitHub no ambiente de build.
#   2. Desligar a integracao Git da Vercel e publicar por `vercel deploy --prod`
#      num job que declare `needs: deploy`. Faz a ordem virar dependencia
#      explicita, ao custo de perder preview automatico de pull request.
#
# Enquanto nenhum dos dois estiver ligado, a ordem continua sendo procedimento
# humano: aplicar as migrations e confirmar este workflow verde ANTES de mesclar
# o frontend que depende delas.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_ID: envajznrzfuuumcdtvcj
  SUPABASE_CLI_VERSION: "2.109.1"

jobs:
  deploy:
    name: Apply production migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      # Prefixo SMOKE_ de proposito: `SUPABASE_URL` no escopo do job entraria no
      # ambiente do Supabase CLI, que le variaveis com esse prefixo. Os nomes
      # que o script espera sao mapeados no passo do smoke, e so' la'.
      SMOKE_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      SMOKE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "${SUPABASE_DB_PASSWORD:-}" ] || missing+=("PRODUCTION_DB_PASSWORD")
          # Os segredos do smoke sao cobrados AQUI, e nao no passo que os usa.
          # Cobra-los la' significaria descobrir a ausencia depois de `db push`
          # ja' ter aplicado as migrations: o banco mudaria e o portao que
          # deveria autorizar a promocao nunca chegaria a rodar. Falhar antes de
          # tocar em producao e' a unica ordem segura.
          [ -n "${SMOKE_SUPABASE_URL:-}" ] || missing+=("PRODUCTION_SUPABASE_URL")
          [ -n "${SMOKE_SUPABASE_SERVICE_ROLE_KEY:-}" ] || missing+=("PRODUCTION_SUPABASE_SERVICE_ROLE_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Segredos ausentes para deploy do banco: %s\n' "${missing[*]}" >&2
            echo 'Cadastre-os no environment/repository secrets do GitHub antes de liberar migrations para producao.' >&2
            exit 1
          fi

      - name: Configure Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          release="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}"
          archive="supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          downloaded=""
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 5 \
              --connect-timeout 20 --max-time 180 \
              --output /tmp/supabase.tar.gz "${release}/${archive}"; then
              downloaded="yes"
              break
            fi
            echo "Supabase CLI download attempt ${attempt} failed; retrying in 15s."
            sleep 15
          done
          if [ -z "${downloaded}" ]; then
            echo "Could not download Supabase CLI ${SUPABASE_CLI_VERSION}." >&2
            exit 1
          fi
          tar -xzf /tmp/supabase.tar.gz -C /tmp supabase supabase-go
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          sudo install -m 0755 /tmp/supabase-go /usr/local/bin/supabase-go
          supabase --version
          supabase db push --help >/dev/null

      - name: Link production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Preview pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --dry-run

      - name: Apply pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push

      - name: Verify migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list
          # Segundo dry-run: se ainda restar migration pendente depois do push,
          # o push nao concluiu o que prometeu e a aplicacao nao pode ser
          # promovida sobre este estado.
          supabase db push --dry-run

      # Smoke test de contrato: as RPCs que a aplicacao chama pelo nome existem
      # neste banco? E a checagem que faltava — `npm run db:rpc` prova que o
      # repositorio e coerente consigo mesmo, nao que o ambiente recebeu as
      # migrations. Foi essa lacuna que produziu PGRST202 em producao duas vezes.
      - name: Smoke test do contrato de RPC
        shell: bash
        env:
          SUPABASE_URL: ${{ env.SMOKE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SMOKE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          node scripts/smoke-rpc-contract.mjs
