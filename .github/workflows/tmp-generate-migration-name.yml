name: Temporary migration name generator

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Supabase CLI
        env:
          SUPABASE_CLI_VERSION: "2.109.1"
        run: |
          set -euo pipefail
          release="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}"
          arquivo="supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --output /tmp/supabase.tar.gz "${release}/${arquivo}"
          tar -xzf /tmp/supabase.tar.gz -C /tmp supabase supabase-go
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          sudo install -m 0755 /tmp/supabase-go /usr/local/bin/supabase-go
      - name: Generate migration identifier
        run: |
          set -euo pipefail
          supabase migration new restringir_marca_publica
          find supabase/migrations -maxdepth 1 -type f -name '*_restringir_marca_publica.sql' -printf '%f\n'
