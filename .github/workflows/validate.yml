name: Essential quality gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: essential-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application:
    name: Application validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      # Antes do build de propósito: os testes cobrem a lógica que decide quem
      # entra na plataforma, e falham em segundos. Build leva minutos.
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  # A validação funcional exige uma cópia do banco e roda fora do CI. Aqui
  # verificamos a integridade estática do conjunto de migrations versionado.
  migrations:
    name: Migration static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate migration files
        run: npm run db:migrations
