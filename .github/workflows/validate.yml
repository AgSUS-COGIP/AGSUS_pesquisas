name: Internal quality gate

on:
  push:
    branches:
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "test/**"
      - "chore/**"
      - "agent/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: internal-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Tests, TypeScript, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://envajznrzfuuumcdtvcj.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-placeholder
      DB_NAMING_BASE: origin/main
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate database naming
        run: npm run db:naming

      - name: Unit tests
        run: npm test

      - name: TypeScript validation
        run: npm run typecheck

      - name: ESLint validation
        run: npm run lint

      - name: Production build
        run: npm run build
