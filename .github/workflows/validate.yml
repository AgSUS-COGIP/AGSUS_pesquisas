name: Essential quality gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: essential-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application:
    name: Application validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://envajznrzfuuumcdtvcj.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-placeholder
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build

  database:
    name: Database reconstruction
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        env:
          SUPABASE_CLI_VERSION: "2.109.1"
        run: |
          set -euo pipefail
          release="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}"
          archive="supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output /tmp/supabase.tar.gz "${release}/${archive}"
          tar -xzf /tmp/supabase.tar.gz -C /tmp supabase supabase-go
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          sudo install -m 0755 /tmp/supabase-go /usr/local/bin/supabase-go
      - name: Rebuild database from migrations
        run: |
          set -euo pipefail
          if [ ! -f supabase/config.toml ]; then supabase init; fi
          supabase start
          supabase db reset
      # Os arquivos de supabase/tests existiam sem nunca serem executados: o job
      # reconstruía o banco e parava aí. Um teste que não roda é documentação
      # com sintaxe de teste — envelhece sem avisar. O passo é separado do
      # anterior de propósito, para que a falha diga se quebrou a reconstrução
      # ou uma asserção.
      - name: Run database tests
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        run: command -v supabase >/dev/null && supabase stop --no-backup || true
