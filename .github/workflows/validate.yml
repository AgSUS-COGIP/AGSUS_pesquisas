name: Internal quality gate

on:
  push:
    branches:
      - main
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "test/**"
      - "chore/**"
      - "agent/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: internal-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application:
    name: Application validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://envajznrzfuuumcdtvcj.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-placeholder
      DB_NAMING_BASE: origin/main
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate migration identifiers
        run: npm run db:migrations

      - name: Validate database naming
        run: npm run db:naming

      - name: Unit tests
        run: npm test

      - name: TypeScript validation
        run: npm run typecheck

      - name: ESLint validation
        run: npm run lint

      - name: Production build
        run: npm run build

  database:
    name: Supabase migrations and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A action `supabase/setup-cli` baixa o binário sem repetir a tentativa: um
      # soquete fechado no meio do download derruba o passo, e todos os seguintes
      # falham com `supabase: command not found` (código 127). Aconteceu nas
      # execuções #66, #67 e #69, com o mesmo commit passando na #68 — falha de
      # rede, não do banco. O download aqui é o mesmo, mas insiste antes de desistir.
      - name: Configure Supabase CLI
        env:
          SUPABASE_CLI_VERSION: "2.109.1"
        run: |
          set -euo pipefail
          release="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}"
          arquivo="supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
          baixado=""
          for tentativa in 1 2 3; do
            if curl --fail --silent --show-error --location \
                    --retry 3 --retry-all-errors --retry-delay 5 \
                    --connect-timeout 20 --max-time 180 \
                    --output /tmp/supabase.tar.gz "${release}/${arquivo}"; then
              baixado="sim"
              break
            fi
            echo "Tentativa ${tentativa} de baixar a Supabase CLI falhou; nova tentativa em 15s."
            sleep 15
          done
          if [ -z "${baixado}" ]; then
            echo "Não foi possível baixar a Supabase CLI ${SUPABASE_CLI_VERSION}." >&2
            exit 1
          fi
          # A CLI são **dois** binários que precisam ficar lado a lado: `supabase`
          # é um shim que encaminha a maioria dos comandos para `supabase-go`.
          # Instalar só o primeiro passa em `--version` e em `init`, e falha em
          # `start` com "Could not find the `supabase-go` binary".
          tar -xzf /tmp/supabase.tar.gz -C /tmp supabase supabase-go
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          sudo install -m 0755 /tmp/supabase-go /usr/local/bin/supabase-go
          supabase --version
          # `start --help` obriga o shim a resolver o `supabase-go`, o que
          # `--version` sozinho não faz: a instalação incompleta seria detectada
          # aqui, e não três passos adiante.
          supabase start --help >/dev/null

      - name: Initialize local Supabase configuration
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from migrations
        run: supabase db reset

      - name: Database and RLS tests
        run: supabase test db

      # A única porta que confere frontend contra banco. Ela mora aqui, e não no
      # job `application`, porque só aqui existe o esquema real reconstruído a
      # partir das migrations — comparar contra um retrato versionado seria
      # comparar contra algo que envelhece sozinho.
      - name: Validate RPC contracts against the rebuilt schema
        run: |
          set -euo pipefail
          command -v psql >/dev/null || {
            echo "psql não está disponível no runner; sem ele não há como ler as assinaturas." >&2
            exit 1
          }
          # `supabase/config.toml` não é versionado: o `init` do passo anterior o
          # cria com as portas padrão, então 54322 é o banco local desta execução.
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --no-psqlrc --quiet --tuples-only --no-align \
            --file scripts/dump-rpc-signatures.sql > /tmp/rpc-signatures.json
          test -s /tmp/rpc-signatures.json || {
            echo "A consulta de assinaturas não devolveu nada." >&2
            exit 1
          }
          RPC_SIGNATURES=/tmp/rpc-signatures.json node scripts/validate-rpc-contracts.mjs

      # Sem a guarda, a limpeza também falha com 127 quando a CLI não instalou, e
      # o erro real fica atrás de dois erros que só são consequência dele.
      - name: Stop local Supabase
        if: always()
        run: command -v supabase >/dev/null && supabase stop --no-backup || true
