name: TEMP generate branding migration name

on:
  push:
    branches:
      - fix/public-branding-hardening
    paths:
      - .github/workflows/temp-generate-branding-migration-name.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-branding-hardening
      - name: Generate migration name with Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          version="2.109.1"
          curl --fail --silent --show-error --location \
            -o /tmp/supabase.tar.gz \
            "https://github.com/supabase/cli/releases/download/v${version}/supabase_${version}_linux_amd64.tar.gz"
          tar -xzf /tmp/supabase.tar.gz -C /tmp supabase
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          supabase --version

          old_path="supabase/migrations/20260822182831_restringir_marca_publica.sql"
          supabase migration new restringir_marca_publica_expansao
          new_path="$(find supabase/migrations -maxdepth 1 -type f -name '*_restringir_marca_publica_expansao.sql' | sort | tail -n 1)"
          test -n "${new_path}"
          cat "${old_path}" > "${new_path}"
          rm "${old_path}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "chore(db): reordenar migration de marca publica"
          git push origin HEAD:fix/public-branding-hardening
          echo "generated=${new_path}"
