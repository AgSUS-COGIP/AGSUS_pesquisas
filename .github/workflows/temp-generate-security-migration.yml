name: Temporary generate security migration

on:
  push:
    branches:
      - fix/security-audit-hardening-20260823
    paths:
      - .github/workflows/temp-generate-security-migration.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-audit-hardening-20260823
      - name: Generate migration with Supabase CLI
        run: npx --yes supabase@2.109.1 migration new endurecer_auditoria_seguranca
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/*.sql
          git commit -m "chore: gerar migration de hardening"
          git push origin HEAD:fix/security-audit-hardening-20260823
