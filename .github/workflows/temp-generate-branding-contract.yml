name: TEMP generate branding contract migration

on:
  push:
    branches:
      - fix/public-branding-contract
    paths:
      - .github/workflows/temp-generate-branding-contract.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-branding-contract
      - name: Generate migration with Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          version="2.109.1"
          curl --fail --silent --show-error --location \
            -o /tmp/supabase.tar.gz \
            "https://github.com/supabase/cli/releases/download/v${version}/supabase_${version}_linux_amd64.tar.gz"
          tar -xzf /tmp/supabase.tar.gz -C /tmp supabase
          sudo install -m 0755 /tmp/supabase /usr/local/bin/supabase
          supabase --version

          supabase migration new revogar_marca_completa_anon
          path="$(find supabase/migrations -maxdepth 1 -type f -name '*_revogar_marca_completa_anon.sql' | sort | tail -n 1)"
          test -n "${path}"
          cat > "${path}" <<'SQL'
          -- Segunda etapa do rollout expand/contract da marca institucional.
          -- A aplicacao em producao ja usa fc_obter_marca_publica() antes do login.
          revoke execute on function public.fc_obter_marca_plataforma() from anon;
          notify pgrst, 'reload schema';
          SQL

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "security(db): revogar marca completa do anon"
          git push origin HEAD:fix/public-branding-contract
          echo "generated=${path}"
